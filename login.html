<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in - Equipora</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
  <main class="auth-box">
    <h1 class="auth-brand">Equip<span>ora</span></h1>
    <p class="auth-subtitle">Log in to manage your equipment rentals.</p>

    <form id="loginForm" novalidate>
      <label>Email
        <input type="email" id="email" autocomplete="email">
      </label>
      <label>Password
        <input type="password" id="password" autocomplete="current-password">
      </label>
      <p class="form-error" id="formError"></p>
      <button type="submit" class="btn primary full">Log in</button>
    </form>

    <p class="auth-switch">New here? <a href="register.html">Create an account</a></p>

    <div class="demo-box">
      <strong>Demo accounts</strong>
      <p>Admin: admin@rental.com / admin123</p>
      <p>Owner: owner@rental.com / owner123</p>
      <p>Customer: customer@rental.com / customer123</p>
    </div>
  </main>

  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
